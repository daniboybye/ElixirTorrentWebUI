name: Build WebUI, Test and Analyze

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      MIX_ENV: dev

    steps:
      - name: Check out WebUI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore Mix cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.mix
            ~/.cache/rebar3
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Audit dependency metadata
        run: |
          mix deps.unlock --check-unused
          mix hex.audit

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile development code
        run: mix compile --warnings-as-errors

      - name: Compile test code
        env:
          MIX_ENV: test
        run: mix compile --warnings-as-errors

      - name: Run Credo
        run: mix credo --all

      - name: Run Sobelow
        run: mix sobelow --skip --strict --private --exit --threshold medium

      - name: Run Dialyzer
        run: mix dialyzer

      - name: Run coverage tests
        env:
          MIX_ENV: test
        run: timeout --signal=TERM --kill-after=5s 60s mix coveralls
